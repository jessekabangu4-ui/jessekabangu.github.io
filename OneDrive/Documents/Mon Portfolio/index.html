<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Portfolio - Développeur</title>
    <meta name="description" content="Portfolio de développeur : projets, compétences et contact.">
    <meta name="theme-color" content="#0f7a43">
    <link rel="stylesheet" href="Bootstrap/bootstrap.min.css">
    <link rel="icon"
        href="data: image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f7a43'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --primary: #0f7a43;
            --primary-dark: #0c5f36;
            --bg: #f4f7f5;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: rgba(15, 122, 67, 0.12);
            --shadow: 0 12px 30px rgba(15, 122, 67, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #eef7f1 0%, var(--bg) 100%);
            color: var(--text);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section {
            padding: 80px 0;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card);
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 35px rgba(15, 122, 67, 0.12);
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.78);
            border-bottom: 1px solid rgba(15, 122, 67, 0.08);
        }

        .nav-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-weight: 800;
            color: var(--primary-dark);
            font-size: 1.2rem;
        }

        .nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav a {
            color: var(--text);
            font-weight: 600;
        }

        .hero {
            min-height: 88vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .hero-content {
            max-width: 900px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 999px;
            background: rgba(15, 122, 67, 0.08);
            color: var(--primary-dark);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        h1,
        h2,
        h3,
        h4 {
            margin-top: 0;
            color: var(--text);
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 4.2rem);
            font-weight: 800;
            margin: 18px 0 16px;
        }

        h2 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            margin-bottom: 18px;
        }

        p {
            color: var(--muted);
            font-size: 1.05rem;
        }

        .btns {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .btn {
            display: inline-block;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: 1px solid var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            color: #fff;
        }

        .btn-outline {
            border: 1px solid var(--primary);
            color: var(--primary-dark);
            background: transparent;
        }

        .btn-outline:hover {
            background: rgba(15, 122, 67, 0.08);
        }

        .profile-img {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid rgba(255, 255, 255, 0.8);
            box-shadow: var(--shadow);
            margin: 0 auto 30px;
        }

        .project-card {
            padding: 24px;
            border-radius: 18px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .project-card h3 {
            margin-bottom: 12px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        .skill {
            background: rgba(15, 122, 67, 0.08);
            color: var(--primary-dark);
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .contact {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact a {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .contact-icon {
            width: 24px;
            height: 24px;
            display: inline-block;
            flex-shrink: 0;
        }

        .about-content p {
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .section {
                padding: 60px 0;
            }

            .nav-wrap {
                flex-direction: column;
                gap: 10px;
            }

            .profile-img {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="nav-wrap">
            <a class="brand" href="#top">&lt;dev&gt;</a>
            <nav class="nav" aria-label="Navigation principale">
                <a href="#apropos">À propos</a>
                <a href="#competences">Compétences</a>
                <a href="#projets">Projets</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="top">
            <div class="hero-content container">
                <img src="profil.JPG" alt="Photo de profil" class="profile-img">
                <span class="badge">Bonjour, je suis</span>
                <h1 id="nom"></h1>
                <p class="lead" id="lead"></p>
                <div class="btns">
                    <a class="btn btn-primary" href="#realisations">Voir mes réalisations</a>
                    <a class="btn btn-outline" href="#contact">Me contacter</a>
                    <a class="btn btn-outline" href="Jesse_up_cv.pdf" download="Jesse_up_cv.pdf" target="_blank"
                        rel="noopener noreferrer">Télécharger mon CV</a>
                </div>
            </div>
        </section>

        <section id="apropos" class="section">
            <div class="container">
                <h2>À propos</h2>
                <div id="about-content" class="about-content"></div>
            </div>
        </section>

        <section id="competences" class="section">
            <div class="container">
                <h2>Compétences</h2>
                <div id="skills-content" class="skills"></div>
            </div>
        </section>

        <section id="realisations" class="section">
            <div class="container">
                <h2>Réalisations</h2>
                <div id="projects-content" class="row g-4"></div>
            </div>
        </section>

        <section id="contact" class="section">
            <div class="container">
                <h2>Contact</h2>
                <div id="contact-content" class="contact"></div>
            </div>
        </section>
    </main>

    <script>
        const gmailIcon = `
            <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#EA4335" d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-11Zm2.2-.5 6.8 5.2 6.8-5.2H5.2Zm13.3 1.6-6.6 5.1a1 1 0 0 1-1.2 0L5.5 7.6v9.9c0 .3.2.5.5.5h12c.3 0 .5-.2.5-.5V7.6Z"/>
            </svg>
        `;

        const whatsappIcon = `
            <svg class="contact-icon" viewBox="0 0 48 48" aria-hidden="true">
                <circle cx="24" cy="24" r="21" fill="#25D366"/>
                <path fill="#fff" d="M31.4 29.7c-.4-.2-2.1-1-2.4-1.1-.3-.1-.6-.1-.8.1-.2.2-.8.9-1 .9-.2.2-.5.1-.8-.1-.8-.4-1.6-.8-2.3-1.4-.7-.7-1.2-1.4-1.7-2.2-.2-.4-.1-.7.1-1 .1-.2.3-.5.4-.7.1-.2.1-.4.1-.6 0-.2-.1-.5-.3-.7-.2-.2-.8-1.8-.9-2.3-.1-.5-.2-.4-.3-.4h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5 0 1.5 1 2.9 1.2 3.1.2.2 2.4 3.6 5.8 5.1.8.3 1.5.6 2.1.7.9.2 1.7.2 2.4.1.7-.1 2.2-.9 2.5-1.7.3-.8.3-1.4.2-1.6-.1-.2-.4-.3-.8-.6Z"/>
                <path fill="#fff" d="M24.2 15.2c-4.8 0-8.8 3.7-8.8 8.3 0 1.6.5 3.1 1.3 4.3l-.8 3 3.1-.8c1.2.7 2.7 1.1 4.2 1.1 4.8 0 8.8-3.7 8.8-8.3s-4-8.3-8.8-8.3Zm0 15.2c-1.2 0-2.4-.3-3.4-.9l-.3-.2-1.9.5.5-1.8-.2-.3c-.7-1.1-1.1-2.3-1.1-3.6 0-3.7 3-6.7 6.7-6.7s6.7 3 6.7 6.7-3 6.7-6.7 6.7Z"/>
            </svg>
        `;

        async function chargerContenu() {
            try {
                const reponse = await fetch('contenu.json');
                if (!reponse.ok) throw new Error('Fichier introuvable');
                return await reponse.json();
            } catch (error) {
                console.error('Erreur de chargement du contenu :', error);
                return null;
            }
        }

        function afficherContenu(CONTENU) {
            if (!CONTENU) return;

            document.getElementById('nom').textContent = CONTENU.nom || '';
            document.getElementById('lead').textContent = CONTENU.titre || '';
            document.getElementById('about-content').innerHTML = (CONTENU.apropos || [])
                .map(paragraph => `<p>${paragraph}</p>`)
                .join('');

            const skillsContainer = document.getElementById('skills-content');
            skillsContainer.innerHTML = Object.entries(CONTENU.competences || {})
                .map(([categorie, items]) => `
                    <div class="mb-4">
                        <strong>${categorie}</strong>
                        <div class="skills mt-2">
                            ${(items || []).map(item => `<span class="skill">${item}</span>`).join('')}
                        </div>
                    </div>
                `)
                .join('');

            const projets = Array.isArray(CONTENU.projets) ? CONTENU.projets : [];
            document.getElementById('projects-content').innerHTML = projets
                .map(project => `
                    <div class="col-md-6">
                        <div class="project-card">
                            <h3>${project.titre}</h3>
                            <p>${project.description}</p>
                        </div>
                    </div>
                `)
                .join('');

            const contacts = Array.isArray(CONTENU.contact) ? CONTENU.contact : [];
            document.getElementById('contact-content').innerHTML = contacts
                .map(item => {
                    const icon = item.type === 'gmail' ? gmailIcon : whatsappIcon;
                    const target = item.type === 'whatsapp' ? '_blank' : '';
                    const rel = item.type === 'whatsapp' ? 'noopener noreferrer' : '';
                    return `
                        <div class="contact-item">
                            <a class="contact-link" href="${item.href}" target="${target}" rel="${rel}" aria-label="${item.type === 'gmail' ? 'Envoyer un email' : 'Contacter sur WhatsApp'}">
                                ${icon}
                                <span>${item.label}</span>
                            </a>
                        </div>
                    `;
                })
                .join('');
        }

        chargerContenu().then(afficherContenu);
    </script>
</body>

</html>
